[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyquant-workspace"
version = "0.1.0"
description = "User-side tinyquant project: write strategies and implement data adapters."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "tinyquant>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
workspace-data = [
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_nodes*", "data*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
